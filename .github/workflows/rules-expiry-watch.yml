name: Signed rules expiry and availability
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: yuequdao-rules-expiry
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check public signed manifest metadata and alert
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, subprocess, time, urllib.request
          url = 'https://raw.githubusercontent.com/NTYS123/YueQuDao-Rules/main/signed.json'
          repo = os.environ['GITHUB_REPOSITORY']
          prefix = '[阅趣岛] 远程签名规则临近到期或无法读取'
          problem = None
          try:
              req = urllib.request.Request(url, headers={'User-Agent':'YueQuDao-Rules-Expiry-Monitor'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  raw = response.read(16385)
              if len(raw) > 16384:
                  raise ValueError('manifest exceeds 16 KiB')
              envelope = json.loads(raw)
              if set(envelope) != {'payload_b64','signature_hex'}:
                  raise ValueError('unexpected envelope keys')
              payload = json.loads(base64.b64decode(envelope['payload_b64'],validate=True))
              if set(payload) != {'schema','version','issued_unix','expires_unix','endpoints'}:
                  raise ValueError('unexpected payload keys')
              remaining = payload['expires_unix'] - int(time.time())
              print('Published version:',payload['version'],'remaining hours:',remaining//3600)
              if remaining < 72*3600:
                  problem = f'规则 v{payload["version"]} 剩余 {remaining//3600} 小时，或已过期。请检查所有者 Windows 本地定时续签任务及 gh 登录状态。'
          except Exception as exc:
              problem = f'无法读取或解析已发布规则的基本结构：{type(exc).__name__}。请检查 signed.json 发布和网络。'
          # This checks expiry and availability ONLY. The app and owner's local
          # scheduler perform cryptographic Ed25519 verification. No private key
          # is kept in GitHub Actions.
          issues = subprocess.run(['gh','issue','list','--repo',repo,'--state','open',
              '--limit','100','--json','number,title'],capture_output=True,text=True,check=True)
          existing = next((i for i in json.loads(issues.stdout) if i['title']==prefix),None)
          if problem and not existing:
              subprocess.run(['gh','issue','create','--repo',repo,'--title',prefix,
                  '--body',problem+'\n\n注意：此检查不验证数字签名，也不会修改任何播放接口或自动签名。'],check=True)
          elif problem:
              print('Existing issue already open; no duplicate alert.')
          elif existing:
              subprocess.run(['gh','issue','close',str(existing['number']),'--repo',repo,
                  '--comment','公开规则有效期已恢复正常。'],check=True)
          else:
              print('Rules expiry status OK.')
          PY
